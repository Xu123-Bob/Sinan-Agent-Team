finance:
  rules:
    - name: "必须含风险提示"
      type: "regex"
      value: "投资有风险|风险提示|不构成投资建议"
      score: 20
      description: "合规要求"

    - name: "禁止承诺收益"
      type: "forbidden"
      value: "保本|保收益|稳赚|零风险|必涨"
      score: 20
      description: "合规红线"

    - name: "必须含再平衡规则"
      type: "keyword"
      value: "再平衡"
      score: 15
      description: "配置方案必备要素"

    - name: "必须做分散"
      type: "regex"
      value: "股|债|现金|商品"
      score: 15
      description: "至少覆盖三类资产"